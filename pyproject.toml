[project]
name = "llm-structured-extractor"
version = "0.1.0"
description = "Extract structured ticket fields from text using OpenRouter LLM with strict schema enforcement."
requires-python = ">=3.10"

dependencies = [
    "fastapi"
    "uvicorn"
    "pydantic"
    "pydantic-settings"
    "openrouter"
    "python-dotenv"
]

[tool.black]
line-length = 88

[tool.mypy]
strict = true
ignore_missing_imports = true